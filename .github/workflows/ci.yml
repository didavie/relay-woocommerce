name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: find relay-delivery tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/test-sandbox-routing.php

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: [syntax, coding-standards]
    steps:
      - uses: actions/checkout@v5
      - run: ./bin/build-zip.sh
      - uses: actions/upload-artifact@v5
        with:
          name: relay-delivery
          path: build/*.zip
          if-no-files-found: error
